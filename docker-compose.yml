services:
  free-claude-code:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: free-claude-code
    ports:
      - "8082:8082"
    volumes:
      - fcc-data:/root/.fcc
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8082
      - FCC_OPEN_BROWSER=false
    restart: unless-stopped

volumes:
  fcc-data:
    name: fcc_data
