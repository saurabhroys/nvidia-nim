services:
  free-claude-code:
    image: ghcr.io/saurabhroys/nvidia-nim:latest
    container_name: free-claude-code
    command: uv run uvicorn server:app --host 0.0.0.0 --port 8082
    ports:
      - "8082:8082"
    volumes:
      - fcc-data:/root/.fcc
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8082
      - FCC_OPEN_BROWSER=false
    restart: unless-stopped

volumes:
  fcc-data:
    name: fcc_data
